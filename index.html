<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua Scanner App (Test)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; transition: background 0.3s; }
        input { width: 80%; padding: 15px; font-size: 1.2rem; margin-bottom: 20px; border: 2px solid #007bff; }
        
        /* Feedback Classes */
        .success { background-color: #d4edda; }
        .error { background-color: #f8d7da; }
        
        #result-area { margin-top: 20px; font-size: 1.5rem; font-weight: bold; }
        .info { font-size: 1rem; color: #555; margin-top: 5px; }
    </style>
</head>
<body>
    <h2>Aqua Scanner App (test)</h2>
    <input type="text" id="barcode-input" placeholder="Scan..." autofocus autocomplete="off">
    
    <div id="result-area">Ready</div>
    <div id="product-details" class="info"></div>

    <script>
        const input = document.getElementById('barcode-input');
        const resultArea = document.getElementById('result-area');
        const details = document.getElementById('product-details');

        // Sticky Focus (Keeps cursor in box)
        input.addEventListener('blur', () => setTimeout(() => input.focus(), 20));

        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const barcode = input.value;
                input.value = ''; // Clear immediately
                
                try {
                    const res = await fetch('/api/scan', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ barcode })
                    });
                    const data = await res.json();

                    if (data.success) {
                        // Success Feedback
                        document.body.className = 'success';
                        resultArea.innerText = "SUCCESS";
                        resultArea.style.color = "green";
                        details.innerText = `${data.product.Name} ($${data.product.Price})`;
                        // Optional: Vibration
                        if (navigator.vibrate) navigator.vibrate(200);
                    } else {
                        // Error Feedback
                        document.body.className = 'error';
                        resultArea.innerText = "NOT FOUND";
                        resultArea.style.color = "red";
                        details.innerText = "";
                        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                    }

                    // Reset background color after 1 second
                    setTimeout(() => document.body.className = '', 1000);

                } catch (err) {
                    resultArea.innerText = "Network Error";
                }
            }
        });
    </script>
</body>
</html>
